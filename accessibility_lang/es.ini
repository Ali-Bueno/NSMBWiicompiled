help = F1 ayuda. F2 estado. F3 progreso del nivel. F4 enemigos, objetos y tuberías cercanas. F5 sonidos del terreno. F6 sonidos de objetos. F7 y F8 volumen. F9 repetir. Mayúsculas F9 guía de sonidos. I, J, K, L mueven la cámara de bloques, U describe el bloque, O la devuelve a Mario.
sound_guide = Guía de sonidos. Avance y Retroceso de página cambian de sonido, Fin e Inicio cambian de categoría, F9 lo repite, Mayúsculas F9 la cierra.
