guide_wall_step = un escalón de uno o dos bloques: tics, más fuertes al acercarte, por su lado
guide_wall_high = una pared que necesita un salto largo con carrerilla: una vibración lenta
guide_wall_tall = una pared demasiado alta para saltarla: un zumbido grave y fijo
guide_wall_knock = chocar contra una pared; se dice su altura
guide_ceiling = un techo encima, más fuerte y brillante cuanto más bajo
guide_pit = un agujero delante: una ráfaga de viento y la palabra agujero
guide_drop = bajada delante
guide_step = escalón hacia arriba delante
guide_hazard = lava o veneno delante
guide_platform_above = una plataforma encima a la que puedes subir, más aguda cuanto más alta
guide_ground = en el aire: el suelo debajo, un tono suave, más agudo cuanto más cerca
guide_ground_far = en el aire con el suelo muy abajo
guide_ground_hazard = en el aire sobre lava
guide_air_pit = en el aire sobre un agujero: sopla el viento
guide_platform_under = una plataforma más alta apareció debajo
guide_ground_after_pit = vuelve a haber suelo tras un precipicio
guide_landing = aterrizaje
guide_enemy_goomba = un goomba: cada enemigo que puedes pisar tiene un clic y un sonido propio, por su lado
guide_enemy_koopa = un koopa
guide_enemy_above = el mismo goomba cinco bloques más arriba: más agudo
guide_danger = un enemigo que no debes pisar, como un pinchón: sin clic, un zumbido grave y áspero
guide_boss = un jefe
guide_jump_now = viene un enemigo: tres tics cuentan atrás; salta con un toque corto en el cuarto sonido y caerás encima
guide_jump_high = la misma cuenta atrás para un enemigo subido en un saliente: en el pitido doble, salta y mantén el botón
guide_jump_over = la cuenta atrás para un enemigo peligroso: en el zumbido, salta manteniendo el botón para pasar por encima, sin caerle encima
guide_stomp = vas a caer justo encima de un enemigo
guide_danger_below = vas a caer sobre algo peligroso, apártate
guide_item = un objeto o mejora cerca
guide_under_item = estás justo debajo de un objeto: salta recto hacia arriba
guide_moving_item = un objeto que se mueve, como una seta: tics rápidos, síguelo
guide_block = un bloque interrogación cerca, desde su lado, más agudo cuanto más alto
guide_under_block = estás justo debajo de un bloque interrogación: para y salta para golpearlo
guide_pipe = una tubería en la que puedes entrar
guide_goal = la meta, desde su lado
